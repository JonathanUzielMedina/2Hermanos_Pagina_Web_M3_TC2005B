<!DOCTYPE html>
<html lang="es">
    <!-- Metadatos de la página y vincular a hoja de estilos. -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Añadir Producto | Papelería 2 Hermanos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="styles/estilos_generales.css">
        <link rel="stylesheet" href="styles/adicionar_elemento.css">
        <script src="https://kit.fontawesome.com/231a97e579.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container-fluid">
            <!-- Encabezado y barra de navegación. -->
            <header id="header_bar" class="w-100 d-sm-block d-md-flex flex-wrap position-absolute top-0 start-0 justify-content-md-between align-items-md-end align-items-lg-center">
                
                <h1 class="text-center mx-auto">
                    2 Hermanos
                </h1>

                <nav class="mx-sm-auto">
                    <a href="index.html">Inicio</a>
                    <a href="#">Productos</a>
                    <a href="listado_elementos.html">Pedido</a>
                    
                    <!-- Cuando se implemente JavaScript, se creará la función "logout()" para cerrar sesión. -->
                    <button class="logout" onclick="logout()">Salir</button>
                </nav>
            </header>

            <main class="row">
                <div class="row mx-auto">
                    <div class="col-11 mx-auto">
                        <h1 class="title_page justify-content-center mt-lg-5 pt-lg-2">Productos</h1>
                    </div>
                </div>
    
                <!-- Contenedor del formulario -->
                <section class="form-container row mx-auto">
                    <h2 class="mx-auto col-11 pb-2">Añadir un Nuevo Producto</h2>
                    
                    <form class="col-11 mx-auto">
                        <div class="form-box">
                            <!-- Carga de imagen -->
                            <div id="image_input" class="col-10 col-md-4 col-lg-4">
                                <label><strong>Imagen</strong></label>
                                <div class="image_input_box mx-auto w-auto ms-md-2 ms-lg-3 d-flex flex-column align-items-center gap-3">
                                    <i class="fa-solid fa-image fa-3x"></i>
                                    <button id="image_button"><i class="fa-solid fa-paperclip"></i> Cargar imagen</button>
                                </div>
                            </div>
        
                            <!-- Campos del formulario -->
                            <div class="form-group col-12 col-md-8 col-lg-4">
                                <input type="text" class="mx-auto" placeholder="ID del producto">
                                <input type="text" class="mx-auto" placeholder="Código de barras">
                                <input type="text" class="mx-auto" placeholder="Nombre">
                                <input type="text" class="mx-auto" placeholder="Categoría">
                                <input type="number" class="mx-auto" placeholder="Cantidad de artículos">
                                <input type="number" class="mx-auto" placeholder="Costo sin IVA">
                                <input type="number" class="mx-auto" placeholder="Precio de venta">
                            </div>
                        </div>
                        </div>
        
                        <!-- Botones de acción -->
                        <div id="operation-buttons" class="mx-auto text-center mt-1 pb-2">
                            <button type="submit" class="me-2"><i class="fa-solid fa-floppy-disk fa-xl"></i>&nbsp;&nbsp;Guardar</button>
                            <button type="reset"><i class="fa-solid fa-xmark fa-xl"></i>&nbsp;&nbsp;Cancelar</button>
                        </div>
                    </form>
                </section>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    </body>
    <footer class="container-fluid mt-4">
        <div class="row w-100">
            <div class="col text-center p-3 pb-2">
                <h6>&copy; 2025 Papelería 2 Hermanos.</h6>
            </div>
        </div>
    </footer>
</html>
