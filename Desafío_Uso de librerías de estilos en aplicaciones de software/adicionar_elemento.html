<!DOCTYPE html>
<html lang="es">
    <!-- Metadatos de la página y vincular a hoja de estilos. -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Añadir Producto | Papelería 2 Hermanos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="styles/estilos_generales.css">
        <link rel="stylesheet" href="styles/adicionar_elemento.css">
        <script src="https://kit.fontawesome.com/231a97e579.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <!-- Encabezado y barra de navegación. -->
        <header id="header_bar" class="d-sm-block d-md-flex flex-wrap justify-content-md-between align-items-md-center shadow-sm w-100 position-fixed top-0 start-0">
                
            <h1 class="text-center mx-sm-auto my-auto">
                2 Hermanos
            </h1>

            <nav class="mx-sm-auto">
                <a href="index.html">Inicio</a>
                <a href="#">Productos</a>
                <a href="listado_elementos.html">Pedido</a>
                
                <!-- Cuando se implemente JavaScript, se creará la función "logout()" para cerrar sesión. -->
                <button class="logout" onclick="logout()">Salir</button>
            </nav>
        </header>
        <main class="row">
            <h1 class="title_page pt-md-5 mt-md-2 mx-auto">Productos</h1>
    
            <!-- Contenedor del formulario -->
            <section class="form-container">
                <h2 class="mx-auto">Añadir un Nuevo Producto</h2>
                
                <form>
                    <div class="form-box">
                        <!-- Carga de imagen -->
                        <div id="image_input">
                            <label><strong>Imagen</strong></label>
                            <div class="image_input_box">
                                <i class="fa-solid fa-image fa-3x"></i>
                                <button id="image_button"><i class="fa-solid fa-paperclip"></i> Cargar imagen</button>
                            </div>
                        </div>
    
                         <!-- Campos del formulario -->
                          <div class="form-group">
                            <input type="text" placeholder="ID del producto">
                            <input type="text" placeholder="Código de barras">
                            <input type="text" placeholder="Nombre">
                            <input type="text" placeholder="Categoría">
                            <input type="number" placeholder="Cantidad de artículos">
                            <input type="number" placeholder="Costo sin IVA">
                            <input type="number" placeholder="Precio de venta">
                        </div>
                    </div>
                    </div>
    
                    <!-- Botones de acción -->
                    <div id="operation-buttons">
                        <button type="submit"><i class="fa-solid fa-floppy-disk fa-xl"></i>&nbsp;&nbsp;Guardar</button>
                        <button type="reset"><i class="fa-solid fa-xmark fa-xl"></i>&nbsp;&nbsp;Cancelar</button>
                    </div>
                </form>
            </section>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    </body>
    <footer></footer>
</html>
